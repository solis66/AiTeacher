# AiTeachers 前端 Nginx 站点配置
# - 托管 Vue 构建产物（dist）为静态站点
# - 把后端相关路径（/api、/chat、/login、/get_history 等）反代到 backend 容器
# - SPA 历史路由回退到 index.html
#
# 前端所有请求都用相对路径，故采用“同源反代”，无需改 VITE_API_BASE、无跨域问题。

server {
    listen 80;
    server_name _;

    # 上传体积上限。nginx 默认只有 1m，而手机拍的作文图通常 2~5MB、
    # 后端 validate_upload 放行单文件 20MB —— 不放开的话，大图会在 nginx
    # 这一层被 413 直接拦掉，请求根本到不了后端，前端表现为「上传失败」
    # 且后端日志里查不到任何记录，很容易误判成前端的问题。
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # 后端接口反代（SSE/流式输出：关闭 buffering，禁止缓存）
    # 覆盖后端实际使用的全部 HTTP 前缀；新增接口时在此追加（或改用更宽的 /api）
    # 注意：注册接口是 /register，配置检查是 /config/check，漏掉会 404。
    location ~ ^/(api|chat|login|register|get_history|save_history|delete_history|ocr|health|config)(/|$) {
        proxy_pass http://backend:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 生成可能较长且为流式，给足时间并关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源 & SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 关闭 favicon 等常见缺省 404 噪音（可选）
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}