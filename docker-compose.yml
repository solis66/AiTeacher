# AiTeachers 单机一键编排：backend(Flask) + frontend(Nginx)
#
# 用法（服务器上，仓库根目录）：
#   docker compose up -d --build
#
# 环境变量从仓库根目录的 .env 读取（.env 已被 .gitignore 排除，不入库）
#
# 单机方案要点：
#   - 前端 Nginx 占宿主机 80，静态页和接口同源，无跨域、无需 Vercel
#   - backend 不映射宿主机端口，只在 compose 内网暴露，由 nginx 反代 /api 等前缀
#   - 数据卷落在宿主机目录，重建容器不丢
#
# ⚠️ 与 docker-compose.backend.yml 互斥：两者都占宿主机 80，不能同时运行。
#    从「只跑后端」切换到本文件前，先执行：
#      docker compose -f docker-compose.backend.yml down
#    （不要加 -v；数据是 bind mount，down 不会删数据）

services:
  backend:
    build:
      # 构建上下文必须是仓库根：backend/Dockerfile 里是 COPY backend/xxx，
      # 若写成 context: ./backend 会导致 COPY 找不到文件、构建直接失败。
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 基础镜像可覆盖：国内直连 docker.io 常超时，或被失效镜像源返回 not found。
        # 加速器不可用时直接指向可用仓库：
        #   BASE_IMAGE=docker.m.daocloud.io/library/python:3.11-slim docker compose up -d --build
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
        # pip / apt 源：默认公网阿里云，任何云厂商都可达。
        # 云厂商内网源更快，用环境变量覆盖即可（不必改本文件）：
        #   阿里云：PIP_INDEX_URL=http://mirrors.cloud.aliyuncs.com/pypi/simple
        #   腾讯云：PIP_INDEX_URL=http://mirrors.cloud.tencent.com/pypi/simple
        # 内网源只在对应云的内网可达，填错会直接构建失败（pip 连不上）。
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # 生产模式：关闭 debug，端口 8501（Dockerfile 内 EXPOSE 8501）
      - PORT=8501
      - FLASK_DEBUG=0
    # 运行期数据必须落到宿主机，否则 docker compose up --build 重建容器即丢：
    #   /app/history      咨询会话记录（Markdown）
    #   /app/data/reviews 批改记录（reviews.sqlite3 + 上传的作文图片）
    #   /app/chroma_db    RAG 向量库（重建会触发重新 embedding，很慢且费额度）
    volumes:
      - ./backend/history:/app/history
      - ./backend/data/reviews:/app/data/reviews
      - ./backend/chroma_db:/app/chroma_db
    # 依赖 chromadb/onnxruntime，启动较慢；给足健康检查超时
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8501/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        # npm 源可覆盖：国内默认走 npmmirror，直连官方源会慢到超时。
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    # 对外只暴露 Nginx 的 80（HTTP）。HTTPS 可后续用 acme.sh/certbot 或经 CNAME 的云 CDN 证书补。
    # 注意：backend 未映射宿主机端口，只能经 nginx 反代访问 —— 这是有意的，
    # 后端不直接暴露公网，安全组也只需放行 80。
    ports:
      - "80:80"
    depends_on:
      backend:
        # 用 service_started 而不是 service_healthy：后端带 chromadb/onnxruntime，
        # 冷启动要 1~2 分钟，且密钥有问题时 /health 会持续返回 503。
        # 若等 healthy，前端（含静态页）会一直起不来，整站表现为「拒绝连接」，很难排查。
        condition: service_started