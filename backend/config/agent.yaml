# Agent 执行护栏（避免模型在「模型→工具→模型」循环里停不下来）
#
# recursion_limit：单次问答允许的图步数上限。langgraph 里每个模型节点、工具节点、
#   中间件节点都算一步——实测「检索两次 + 作答」这一正常流程就会用掉 8 步左右。
#   因此这里给到 20 步作为硬兜底；真正的循环控制由 agent_max_tool_calls 负责：
#   工具预算用完后会直接把工具定义从模型请求里摘掉，模型只能收尾作答。
#   超过 20 步说明出现了预期外的循环，LangGraph 抛 GraphRecursionError，
#   由 react_agent 给出兜底提示，而不是让请求无限挂起。
agent_recursion_limit: 20

# max_tool_calls：单次问答最多真正执行的工具调用次数（按本轮已产生的工具结果计数）。
#   知识库检索 2 次足够回答绝大多数问题。超过后不再真正检索，而是把
#   「已达上限，请基于现有资料作答」作为工具结果回给模型，让它直接收尾。
#   顺序上：这个上限先生效（用户得到正常回答），recursion_limit 是硬兜底。
agent_max_tool_calls: 2
