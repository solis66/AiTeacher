collection_name: agent
persist_directory: chroma_db
k: 3
data_path: data
md5_hex_store: md5.text
allowed_knowledge_file_type: ["txt"]

chunk_size: 200
chunk_overlap: 20
separators:  ["\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", ""]

# ---------------------------------------------------------------------------
# 咨询检索（学生 / 老师与 AI 的问答）配置
#
# 与上方「批改」配置分开的原因：批改用的 collection 装的是权威评分标准（短条目、
# 权威依据），咨询检索装的是教研语料与**学生历次批改结果**（长文本、教学案例）。
# 混在一个 collection 里，k 小的时候语义空间会被评分标准片段挤满，检索形同虚设。
# 切片参数也必须分开：评分标准是 200 字的短条目，教研材料是 400 字上下的方法论。
# ---------------------------------------------------------------------------
consult:
  # 静态教研知识库（data/knowledge/**/*.md）
  knowledge_collection: consult_knowledge
  knowledge_path: data/knowledge
  knowledge_chunk_size: 400
  knowledge_chunk_overlap: 50
  knowledge_md5_store: md5_knowledge.text
  # 语料总字数低于该值时不做向量检索，直接全文注入 prompt。
  # 依据：语料规模小时向量检索是负收益——有漏检、有延迟、要调 4 个参数，
  # 而全量注入零漏检、零延迟、完全可控。超过该值再切到检索（见 knowledge_loader）。
  full_inject_limit: 12000

  # 批改案例库（review_cases：由 reviews.sqlite3 的 done 记录构建）
  case_collection: review_cases
  index_state: review_index_state.json
  case_max_reviews: 500          # 单个索引批次最多处理的记录数

  # 检索参数
  k_knowledge: 4                 # 教研资料召回条数
  k_cases: 6                     # 批改案例召回条数
  score_threshold: 0.20          # 相似度阈值：低于该值的片段直接丢弃
  # ↑ 该值经实测标定（qwen3.7-text-embedding + chroma 默认 l2 距离）：
  #     无关问题「今天天气怎么样」  最高分 0.147  → 应被过滤
  #     主题相关「结构问题」        最高分 0.256  → 应被保留
  #     高度相关「错别字和标点」    最高分 0.567
  #   取 0.20 落在「无关 / 相关」之间。注意：该阈值与 embedding 模型的距离尺度绑定，
  #   更换向量模型后必须重新标定。
  #   咨询场景与批改场景最重要的差别：批改不能拒答（必须给分），咨询必须能拒答。
  #   低分片段塞给模型会诱导它强行引用，产生幻觉且表述更自信。
  timeout: 8                     # 单次检索超时（秒），超时降级为「无参考资料」

  # -------------------------------------------------------------------------
  # 会话记忆（滚动摘要 + 长期语义记忆）
  #   最近 N 条消息保持原文注入，更早的折叠进摘要；长期记忆按批次从对话中抽取。
  #   两者都在回答落盘后的后台线程里整理，不进入请求的关键路径。
  # -------------------------------------------------------------------------
  memory_recent_window: 6        # 摘要窗口：最近 N 条消息仍以原文注入
  memory_summary_max_chars: 300  # 单会话摘要长度上限
  memory_min_new_messages: 8     # 累计新增 N 条消息抽取一次长期记忆
  memory_top_k: 4                # 语义检索时注入的记忆条数
  memory_inline_limit: 8         # 条目不超过该值时全量注入（不做向量排序）
  memory_max_items_per_extract: 5  # 单次抽取最多写入的记忆条数
  # 空向量补算：写入时向量服务不可用会留下无向量的条目，需要事后补。
  # 补算要调外部接口，失败后必须有冷却，否则每轮对话都会重打一次。
  memory_empty_vector_repair_interval: 300   # 同一进程两次补算的最小间隔（秒）
  memory_empty_vector_repair_batch: 64       # 单次补算最多处理多少条

  # -------------------------------------------------------------------------
  # 混合检索重排（向量召回 + 字面覆盖）
  #   召回仍走向量检索，候选集扩大到 k * factor 后按混合分重排。
  #   相似度阈值仍作用在向量分上：0.20 是按向量尺度标定的，混入字面分会让阈值漂移。
  # -------------------------------------------------------------------------
  hybrid_candidate_factor: 3     # 候选集倍数（k * factor 条参与重排）
  hybrid_vector_weight: 0.7      # 重排时向量分权重
  hybrid_lexical_weight: 0.3     # 重排时问句字面覆盖率权重
